<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBUXLAUVN - Hệ Thống Nạp Robux Uy Tín</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f0e;
            color: #e2e8f0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: #131a18;
            border: 1px solid #1f332b;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 255, 128, 0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #00b050, #008037);
            color: white;
            padding: 24px;
            text-align: center;
        }
        .header h2 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }
        .header p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: #1a2421;
            border: 1px solid #283832;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #00ff80;
            box-shadow: 0 0 0 2px rgba(0, 255, 128, 0.2);
        }
        .package-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        .package-item {
            border: 1px solid #283832;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #18221f;
        }
        .package-item.active {
            border-color: #00ff80;
            background: rgba(0, 255, 128, 0.05);
            box-shadow: 0 0 10px rgba(0, 255, 128, 0.1);
        }
        .package-item .robux-amount {
            font-weight: 800;
            font-size: 16px;
            color: #00ff80;
            margin-bottom: 4px;
        }
        .package-item .price {
            font-size: 13px;
            color: #a0aec0;
        }
        .badge-secure {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: #00ff80;
            background: rgba(0, 255, 128, 0.08);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 18px;
        }
        .btn-submit {
            width: 100%;
            background: #00ff80;
            color: #000;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-submit:hover {
            background: #00cc66;
        }
        /* Khu vực hiển thị QR Code thanh toán */
        #qrSection {
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .qr-box {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 10px;
            color: #000;
        }
        .qr-box img {
            width: 220px;
            height: auto;
            border-radius: 8px;
        }
        .order-info {
            background: #18221f;
            border: 1px solid #283832;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 13px;
        }
        .order-info p {
            margin-bottom: 6px;
        }
        .order-info span {
            color: #00ff80;
            font-weight: bold;
        }
        .btn-back {
            background: transparent;
            border: 1px solid #283832;
            color: #a0aec0;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            margin-top: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-back:hover {
            background: #18221f;
            color: #fff;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>ROBUXLAU</h2>
        <p>Hệ thống nạp Robux tự động 24/7 - An toàn tuyệt đối</p>
    </div>
    <div class="content">
        <!-- Form nhập thông tin -->
        <form id="topupForm">
            <div class="badge-secure">
                🔒 Kết nối mã hóa SSL 256-bit - Bảo mật 100%
            </div>

            <div class="form-group">
                <label for="username">Tên tài khoản Roblox</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập chính xác Username..." required>
            </div>

            <label style="display:block; font-weight:600; margin-bottom:8px; font-size:13px; color:#a0aec0; text-transform:uppercase;">Chọn gói nạp ưu đãi</label>
            <div class="package-grid">
                <div class="package-item active" onclick="selectPackage(this, '400', '50.000đ')">
                    <div class="robux-amount">400 Robux</div>
                    <div class="price">50.000đ</div>
                </div>
                <div class="package-item" onclick="selectPackage(this, '800', '100.000đ')">
                    <div class="robux-amount">800 Robux</div>
                    <div class="price">100.000đ</div>
                </div>
                <div class="package-item" onclick="selectPackage(this, '1700', '200.000đ')">
                    <div class="robux-amount">1,700 Robux</div>
                    <div class="price">200.000đ</div>
                </div>
                <div class="package-item" onclick="selectPackage(this, '4500', '500.000đ')">
                    <div class="robux-amount">4,500 Robux</div>
                    <div class="price">500.000đ</div>
                </div>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Phương thức thanh toán</label>
                <select id="paymentMethod" class="form-control">
                    <option value="momo">Ví điện tử MoMo / QR Code</option>
                    <option value="bank">Chuyển khoản Ngân hàng</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Tạo Mã Thanh Toán</button>
        </form>

        <!-- Phần hiển thị QR Code sau khi bấm xác nhận -->
        <div id="qrSection">
            <div class="order-info">
                <p>Tài khoản: <span id="outUser"></span></p>
                <p>Gói nạp: <span id="outPackage"></span></p>
                <p>Số tiền cần trả: <span id="outPrice" style="color: #00ff80; font-size: 15px;"></span></p>
            </div>
            
            <p style="font-size: 13px; color: #a0aec0; margin-bottom: 8px;">Quét mã QR bên dưới để thanh toán:</p>
            <div class="qr-box">
                <!-- Sử dụng hình ảnh QR bạn cung cấp[span_0](start_span)[span_0](end_span) -->
                <img src="data:image/jpeg;base64,..." alt="QR Thanh Toan" id="qrImage">
                <p style="color: #000; font-weight: bold; font-size: 12px; margin-top: 5px;">TRAN THE VY</p>
            </div>
            
            <button type="button" class="btn-back" onclick="goBack()">Quay lại / Đổi thông tin</button>
        </div>
    </div>
</div>

<script>
    let selectedPkg = { robux: '400', price: '50.000đ' };

    function selectPackage(element, robux, price) {
        document.querySelectorAll('.package-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        selectedPkg = { robux, price };
    }

    // Đính kèm trực tiếp link ảnh QR của bạn vào đây để web hiển thị đúng
    const myQrUrl = "https://i.imgur.com/8W4gB7e.jpeg"; // Bạn có thể thay link ảnh QR tải lên của bạn vào đây

    document.getElementById('topupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        
        if(!username) {
            alert('Vui lòng nhập tên tài khoản Roblox!');
            return;
        }

        // Hiển thị thông tin lên giao diện QR
        document.getElementById('outUser').innerText = username;
        document.getElementById('outPackage').innerText = selectedPkg.robux + ' Robux';
        document.getElementById('outPrice').innerText = selectedPkg.price;
        
        // Gán nguồn ảnh QR (bạn có thể thay link ảnh gốc của bạn vào biến myQrUrl ở trên)
        // Hoặc tạm thời dùng ảnh trực tiếp từ thiết bị của bạn:
        document.getElementById('qrImage').src = "https://i.ibb.co/68v8L5K/qr-momo.jpg"; // Hoặc link ảnh của bạn

        // Ẩn form nhập, hiện khung QR
        document.getElementById('topupForm').style.display = 'none';
        document.getElementById('qrSection').style.display = 'block';
    });

    function goBack() {
        document.getElementById('qrSection').style.display = 'none';
        document.getElementById('topupForm').style.display = 'block';
    }
</script>

</body>
</html>
