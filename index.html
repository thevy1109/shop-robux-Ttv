<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Nạp Robux Chính Thức</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: #e50914; /* Tông màu đỏ nổi bật kiểu VNG */
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h2 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #444;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #e50914;
        }
        .package-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .package-item {
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fafbfc;
        }
        .package-item.active {
            border-color: #e50914;
            background: #fff5f5;
        }
        .package-item .robux-amount {
            font-weight: bold;
            font-size: 16px;
            color: #e50914;
            margin-bottom: 4px;
        }
        .package-item .price {
            font-size: 13px;
            color: #666;
        }
        .btn-submit {
            width: 100%;
            background: #e50914;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
        }
        .btn-submit:hover {
            background: #b80710;
        }
        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Thanh Toán Nạp Robux</h2>
    </div>
    <div class="content">
        <form id="topupForm">
            <!-- Nhập thông tin tài khoản -->
            <div class="form-group">
                <label for="username">Tài khoản Roblox (Username)</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên tài khoản của bạn..." required>
            </div>

            <!-- Chọn gói nạp -->
            <label>Chọn gói nạp</label>
            <div class="package-grid" style="margin-top: 8px;">
                <div class="package-item active" onclick="selectPackage(this, '400', '50.000đ')">
                    <div class="robux-amount">400 Robux</div>
                    <div class="price">50.000đ</div>
                </div>
                <div class="package-item" onclick="selectPackage(this, '800', '100.000đ')">
                    <div class="robux-amount">800 Robux</div>
                    <div class="price">100.000đ</div>
                </div>
                <div class="package-item" onclick="selectPackage(this, '1700', '200.000đ')">
                    <div class="robux-amount">1,700 Robux</div>
                    <div class="price">200.000đ</div>
                </div>
                <div class="package-item" onclick="selectPackage(this, '4500', '500.000đ')">
                    <div class="robux-amount">4,500 Robux</div>
                    <div class="price">500.000đ</div>
                </div>
            </div>

            <!-- Phương thức thanh toán -->
            <div class="form-group">
                <label for="paymentMethod">Phương thức thanh toán</label>
                <select id="paymentMethod" class="form-control">
                    <option value="momo">Ví MoMo</option>
                    <option value="bank">Chuyển khoản Ngân hàng (QR Code)</option>
                    <option value="card">Thẻ cào điện thoại (Viettel, Mobifone, Vinaphone)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Xác Nhận Nạp</button>
            <div class="note">Vui lòng kiểm tra kỹ tên tài khoản trước khi bấm xác nhận để tránh nạp nhầm người chơi khác.</div>
        </form>
    </div>
</div>

<script>
    // Hàm xử lý chọn gói nạp giao diện
    function selectPackage(element, robux, price) {
        const items = document.querySelectorAll('.package-item');
        items.forEach(item => item.classList.remove('active'));
        element.classList.add('active');
    }

    // Xử lý khi bấm nút nạp
    document.getElementById('topupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        alert(`Đã ghi nhận yêu cầu nạp cho tài khoản: ${username}. Hệ thống đang chuyển hướng thanh toán...`);
    });
</script>

</body>
</html>
