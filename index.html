<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Vật Phẩm Game - Đổi Quà Trực Tuyến</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0214;
            color: #ffffff;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, #2b0b42, #561266);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ffcc00;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ffcc00;
            letter-spacing: 1px;
        }

        .user-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .banner {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 3px solid #ff4500;
        }

        .banner h1 {
            font-size: 24px;
            color: #ffcc00;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .banner p {
            font-size: 14px;
            color: #ddd;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: #150824;
            border: 1px solid #3d1b61;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #ccc;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background: #090312;
            border: 1px solid #4a2175;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .pkg-item {
            background: #1f0b36;
            border: 1px solid #4a2175;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .pkg-item.active {
            border-color: #ffcc00;
            background: #2b104a;
        }

        .pkg-amount {
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
        }

        .pkg-price {
            font-size: 13px;
            color: #00ffcc;
            margin-top: 5px;
        }

        .badge-x2 {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff0055;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        .payment-methods {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .pay-tab {
            flex: 1;
            padding: 10px;
            background: #090312;
            border: 1px solid #4a2175;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
            color: #aaa;
        }

        .pay-tab.active {
            border-color: #ffcc00;
            color: #fff;
            background: #1f0b36;
        }

        .hidden {
            display: none;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            display: none;
        }
