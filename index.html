<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Thanh Toán Robux Chính Thức</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: #e50914;
            color: white;
            padding: 22px;
            text-align: center;
        }
        .header h2 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #2c3e50;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #fff;
        }
        .form-control:focus {
            border-color: #e50914;
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.15);
        }
        .package-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        .package-item {
            border: 2px solid #e4e6eb;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8f9fa;
        }
        .package-item.active {
            border-color: #e50914;
            background: #fff5f5;
        }
        .package-item .robux-amount {
            font-weight: 700;
            font-size: 16px;
            color: #e50914;
            margin-bottom: 4px;
        }
        .package-item .price {
            font-size: 13px;
            color: #65676b;
        }
        .btn-submit {
            width: 100%;
            background: #e50914;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
        }
        .btn-submit:hover {
            background: #c80811;
        }
        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #65676b;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Cổng Nạp Robux Chính Thức</h2>
    </div>
    <div class="content">
        <form id="topupForm">
            <div class="form-group">
                <label for="username">Tên tài khoản Roblox</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập username của bạn..." required>
            </div>

            <label style="display:block; font-weight:600; margin-bottom:8px; font-size:14px; color:#2c3e50;">Chọn gói nạp</label>
            <div class="package-grid">
                <div class="package-item active" onclick="selectPackage(this, '400', '50.000đ')">
                    <div class="robux-amount">400 Robux</div>
                    <div class="price">50.000đ</div>
                </div>
                <div class="package-item" onclick="selectPackage(this, '800', '100.000đ')">
                    <div class="robux-amount">800 Robux</div>
                    <div class="price">100.000đ</div>
                </div>
                <div class="package-item" onclick="selectPackage(this, '1700', '200.000đ')">
                    <div class="robux-amount">1,700 Robux</div>
                    <div class="price">200.000đ</div>
                </div>
                <div class="package-item" onclick="selectPackage(this, '4500', '500.000đ')">
                    <div class="robux-amount">4,500 Robux</div>
                    <div class="price">500.000đ</div>
                </div>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Phương thức thanh toán</label>
                <select id="paymentMethod" class="form-control">
                    <option value="momo">Ví điện tử MoMo</option>
                    <option value="bank">Chuyển khoản Ngân hàng (QR Code)</option>
                    <option value="card">Thẻ cào điện thoại</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Xác Nhận Nạp</button>
            <div class="note">Vui lòng kiểm tra kỹ tên tài khoản trước khi thanh toán để tránh nhầm lẫn.</div>
        </form>
    </div>
</div>

<script>
    let selectedPkg = { robux: '400', price: '50.000đ' };

    function selectPackage(element, robux, price) {
        document.querySelectorAll('.package-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        selectedPkg = { robux, price };
    }

    document.getElementById('topupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const method = document.getElementById('paymentMethod').value;
        
        if(!username) {
            alert('Vui lòng nhập tên tài khoản!');
            return;
        }

        alert(`Xác nhận nạp ${selectedPkg.robux} Robux (${selectedPkg.price}) cho tài khoản: ${username}\nPhương thức: ${method.toUpperCase()}\n\nĐang kết nối cổng thanh toán...`);
    });
</script>

</body>
</html>
