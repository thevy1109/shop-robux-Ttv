<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF SHOP - Nạp KC Siêu Tốc</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#0a0a0a;color:#fff;overflow-x:hidden}
.nav{background:#151515;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff6a00;position:sticky;top:0;z-index:99}
.logo{font-weight:900;color:#ff6a00;font-size:22px}
.logo span{color:white}
.banner{background:linear-gradient(135deg,#ff6a00,#ff9a00);padding:30px 20px;text-align:center}
.banner h1{font-size:26px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.banner p{margin-top:8px;opacity:.9}
.container{max-width:900px;margin:auto;padding:15px;display:grid;grid-template-columns:1.2fr .8fr;gap:15px}
@media(max-width:700px){.container{grid-template-columns:1fr}}
.card{background:#181818;border:1px solid #2a2a2a;border-radius:16px;padding:20px}
.card-title{font-weight:700;margin-bottom:15px;display:flex;align-items:center;gap:8px}
.card-title i{color:#ff6a00}
.input{width:100%;background:#222;border:1px solid #333;padding:13px;border-radius:10px;color:white;margin-bottom:10px;outline:none}
.input:focus{border-color:#ff6a00}
.package-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pkg{background:#222;border-radius:12px;padding:14px;text-align:center;border:2px solid #222;cursor:pointer;transition:.2s;position:relative}
.pkg:hover{transform:translateY(-3px);border-color:#555}
.pkg.active{border-color:#ff6a00;background:linear-gradient(#332000,#222)}
.pkg .bonus{position:absolute;top:-8px;right:-8px;background:#ffcc00;color:#000;font-size:10px;padding:2px 6px;border-radius:20px;font-weight:bold}
.pkg .kc{font-weight:900;font-size:16px}
.pkg .price{color:#aaa;font-size:13px;margin-top:4px}
.pkg .price b{color:#ffcc00}
.pay-method{display:flex;gap:10px;margin:10px 0}
.pay{flex:1;background:#222;border:2px solid #222;border-radius:10px;padding:12px;text-align:center;cursor:pointer}
.pay.active{border-color:#ff6a00}
.btn-main{width:100%;background:linear-gradient(90deg,#ff6a00,#ff8c00);border:none;padding:15px;border-radius:12px;color:white;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 5px 20px rgba(255,106,0,.4)}
.btn-main:active{transform:scale(.98)}
.info-box{background:#1f1f1f;padding:12px;border-radius:10px;font-size:13px;line-height:1.6;color:#ccc}
.status{padding:6px 10px;border-radius:20px;font-size:12px;background:#00c853;color:white;display:inline-block}
.table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.table th,.table td{padding:8px;border-bottom:1px solid #222;text-align:left}
.footer{text-align:center;padding:30px;color:#555;font-size:13px}
</style>
</head>
<body>
<div class="nav"><div class="logo">FF<span>SHOP</span>.VN</div><div><i class="fa fa-user"></i> Guest</div></div>
<div class="banner"><h1>🔥 NẠP KIM CƯƠNG FREE FIRE -10% 🔥</h1><p>Nạp siêu tốc 30s - An toàn - Bảo hành 100% - Chiết khấu cao</p></div
